# ──────────────────────────────────────────────
# Cosmos Platform — Project Configuration
# ──────────────────────────────────────────────

[project]
name = "cosmos-platform"
version = "0.1.0"
description = "A story-driven space exploration platform."
requires-python = ">=3.13"

# ── Ruff (linter + formatter) ───────────────
[tool.ruff]
target-version = "py313"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Black (formatter) ───────────────────────
[tool.black]
line-length = 88
target-version = ["py313"]

# ── isort ────────────────────────────────────
[tool.isort]
profile = "black"
known_first_party = ["app"]

# ── Pytest ───────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── Mypy ─────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
