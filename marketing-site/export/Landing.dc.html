  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    const templateEl = document.querySelector('script[type="__bundler/template"]');

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';
    function trustedOrigin(e) {

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

8,255,.10),transparent 60%);pointer-events:none;z-index:1;transition:opacity .4s\"><\u002Fdiv>\n\n  <!-- NAV -->\n  <nav ref=\"{{ navRef }}\" style=\"position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px 40px;transition:all .4s;border-bottom:1px solid transparent\">\n    <a href=\"Landing.dc.html\" style=\"display:flex;align-items:center;gap:12px;color:var(--white)\">\n      <span style=\"width:32px;height:32px;border-radius:50%;background:conic-gradient(from 180deg,#4DA8FF,#8B5CF6,#00E5FF,#4DA8FF);display:inline-block;box-shadow:0 0 20px rgba(77,168,255,.6)\"><\u002Fspan>\n      <span style=\"font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:.5px\">COSMORA<\u002Fspan>\n    <\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:34px;font-size:15px\" data-navlinks=\"\">\n      <a href=\"Landing.dc.html\" style=\"color:var(--white);opacity:.9\">Home<\u002Fa>\n      <a href=\"About.dc.html\" style=\"color:var(--white);opacity:.7\">About<\u002Fa>\n      <a href=\"Features.dc.html\" style=\"color:var(--white);opacity:.7\">Features<\u002Fa>\n      <a href=\"Pricing.dc.html\" style=\"color:var(--white);opacity:.7\">Pricing<\u002Fa>\n      <a href=\"Contact.dc.html\" style=\"color:var(--white);opacity:.7\">Contact<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:14px\">\n      <button sc-camel-on-click=\"{{ openSearch }}\" style=\"display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid rgba(255,255,255,.12);color:var(--white);padding:8px 14px;border-radius:12px;font-size:13px;cursor:pointer;backdrop-filter:blur(10px)\" style-hover=\"border-color:rgba(77,168,255,.6)\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m21 21-4-4\"><\u002Fpath><\u002Fsvg>\n        <span style=\"opac .dc.html\" style=\"display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#4DA8FF,#8B5CF6);color:#fff;padding:15px 30px;border-radius:14px;font-weight:600;font-size:16px;animation:glowpulse 3.5s ease-in-out infinite\">\n            Start Exploring\n            <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M5 12h14m-6-6 6 6-6 6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fa>\n          <button sc-camel-on-click=\"{{ openTrailer }}\" style=\"display:inline-flex;align-items:center;gap:12px;background:var(--glass);border:1px solid rgba(255,255,255,.16);color:var(--white);padding:15px 26px;border-radius:14px;font-weight:500;font-size:16px;cursor:pointer;backdrop-filter:blur(12px)\" style-hover=\"border-color:rgba(77,168,255,.6);background:rgba(255,255,255,.1)\">\n            <span style=\"width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            Watch Trailer\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div ref=\"{{ scrollHintRef }}\" style=\"position:absolute;bottom:34px;right:48px;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;color:rgba(245,247,250,.5);font-size:12px;letter-spacing:2px\">\n      SCROLL\n      <span style=\"width:1px;height:40px;background:linear-gradient(rgba(77,168,255,.8),transparent);animation:floaty 2s ease-in-out infinite\"><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- LIVE STATISTICS -->\n  <section style=\"position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:40px 40px 90px\">\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px\" data-stats=\"\">\n      <div style=\"grid-column:1/ >+<\u002Fdiv>\n        <div style=\"color:rgba(245,247,250,.65);font-size:14px;margin-top:6px\">Interactive 3D Views<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FEATURES -->\n  <section style=\"position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:40px 40px 90px\">\n    <div data-reveal=\"\" style=\"text-align:center;max-width:640px;margin:0 auto 56px\">\n      <div style=\"color:var(--cyan);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px\">The platform<\u002Fdiv>\n      <h2 style=\"font-family:'Space Grotesk';font-weight:700;font-size:clamp(30px,4vw,52px);letter-spacing:-1px;line-height:1.08\">One universe. Every way to explore it.<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px\" data-feature-grid=\"\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FEATURED STORY / COUNTDOWN / HIGHLIGHTS -->\n  <section style=\"position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:40px 40px 90px\">\n    <div style=\"display:grid;grid-template-columns:1.4fr 1fr;gap:22px\">\n      <div data-reveal=\"\" style=\"position:relative;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.1);min-height:420px;background:radial-gradient(600px 400px at 30% 30%,rgba(139,92,246,.4),transparent 60%),radial-gradient(500px 400px at 80% 80%,rgba(255,123,84,.35),transparent 55%),#08111F\">\n        <div style=\"position:absolute;inset:0;background:url('data:image/svg+xml;utf8,') no-repeat\"><\u002Fdiv>\n        <div style=\"position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,transparent 40%,rgba(3,7,18,.92))\"><\u002Fdiv>\n        <div style=\"position:absolute;left:34px;bottom:34px;right:34px\">\n          <span style=\"display:inline-block;padding:6px 14px;border-radius:999px;background:rgba(0,229,255,.15);border:1px solid rgba(0,229,255,.4);color:var(--cyan);font-size:12px;letter-spacing:1px;margin-bottom:16px\">FEATURED STORY<\u002Fspan>\n          <h3 style=\"font-family:'Space Grotesk';font-weight:700;font-size:34px;line-height:1.1;margin-bottom:12px\">The Pale Blue Dot, Revisited<\u002Fh3>\n          <p style=\"color:rgba(245,247,250,.72);max-width:460px;margin-bottom:18px\">Trace Voyager's journey to the edge of the solar system in an immersive scrollable narrative — 12 chapters, real telemetry, cinematic sound.<\u002Fp>\n          <a href=\"Features.dc.html\" style=\"display:inline-flex;align-items:center;gap:8px;font-weight:600\">Read the story <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M5 12h14m-6-6 6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-rows:1fr auto;gap:22px\">\n        <div data-reveal=\"\" style=\"border-radius:24px;padding:30px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(160deg,rgba(255,123,84,.12),rgba(139,92,246,.08)),var(--glass);backdrop-filter:blur(14px)\">\n          <div style=\"color:var(--orange);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px\">Next Launch · ISRO<\u002Fdiv>\n          <h3 style=\"font-family:'Space Grotesk';font-weight:700;font-size:26px;margin-bottom:6px\">Gaganyaan G1<\u002Fh3>\n          <p style=\"color:rgba(245,247,250,.6);font-size:14px;margin-bottom:22px\">Uncrewed orbital test flight<\u002Fp>\n          <div style=\"display:flex;gap:12px\" data-countdown=\"\">\n            <div style=\"flex:1;text-align:center;padding:14px 6px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)\"><div data-cd=\"d\" style=\"font-family:'Space Grotesk';font-weight:700;font-size:30px;color:var(--white)\">00<\u002Fdiv><div style=\"font-size:11px;color:rgba(245,247,250,.5);letter-spacing:1px\">DAYS<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1;text-align:center;padding:14px 6px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)\"><div data-cd=\"h\" style=\"font-family:'Space Grotesk';font-weight:700;font-size:30px;color:var(--white)\">00<\u002Fdiv><div style=\"font-size:11px;color:rgba(245,247,250,.5);letter-spacing:1px\">HRS<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1;text-align:center;padding:14px 6px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)\"><div data-cd=\"m\" style=\"font-family:'Space Grotesk';font-weight:700;font-size:30px;color:var(--white)\">00<\u002Fdiv><div style=\"font-size:11px;color:rgba(245,247,250,.5);letter-spacing:1px\">MIN<\u002Fdiv><\u002Fdiv>\n            <div style=\"flex:1;text-align:center;padding:14px 6px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)\"><div data-cd=\"s\" style=\"font-family:'Space Grotesk';font-weight:700;font-size:30px;color:var(--cyan)\">00<\u002Fdiv><div style=\"font-size:11px;color:rgba(245,247,250,.5);letter-spacing:1px\">SEC<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"border-radius:24px;padding:26px;border:1px solid rgba(255,255,255,.1);background:var(--glass);backdrop-filter:blur(14px);display:flex;gap:18px;align-items:center\">\n          <div style=\"width:70px;height:70px;border-radius:16px;flex-shrink:0;background:radial-gradient(circle at 35% 30%,#fff,#00E5FF 30%,#8B5CF6 70%,#030712);box-shadow:0 0 30px rgba(0,229,255,.4)\"><\u002Fdiv>\n          <div>\n            <div style=\"color:var(--cyan);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px\">Latest · JWST<\u002Fdiv>\n            <h3 style=\"font-family:'Space Grotesk';font-weight:600;font-size:18px;margin-bottom:4px\">Carina Nebula, in 4K<\u002Fh3>\n            <p style=\"color:rgba(245,247,250,.55);font-size:13px\">New deep-field capture added today<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- TESTIMONIALS -->\n  <section style=\"position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:40px 40px 90px\">\n    <div data-reveal=\"\" style=\"text-align:center;margin-bottom:48px\">\n      <div style=\"color:var(--cyan);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px\">Loved by explorers<\u002Fdiv>\n      <h2 style=\"font-family:'Space Grotesk';font-weight:700;font-size:clamp(28px,3.6vw,46px);letter-spacing:-1px\">From classrooms to mission control<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px\" data-testimonials=\"\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- NEWSLETTER -->\n  <section style=\"position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:40px 40px 100px\">\n    <div data-reveal=\"\" style=\"position:relative;border-radius:28px;padding:60px 48px;text-align:center;overflow:hidden;border:1px solid rgba(77,168,255,.25);background:radial-gradient(700px 400px at 50% 0%,rgba(77,168,255,.25),transparent 60%),linear-gradient(160deg,rgba(139,92,246,.15),rgba(3,7,18,.6))\">\n      <div style=\"position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,.3),transparent 65%);top:-80px;right:-40px;animation:drift 9s ease-in-out infinite\"><\u002Fdiv>\n      <h2 style=\"position:relative;font-family:'Space Grotesk';font-weight:700;font-size:clamp(28px,3.6vw,44px);letter-spacing:-1px;margin-bottom:14px\">Get the cosmos in your inbox<\u002Fh2>\n      <p style=\"position:relative;color:rgba(245,247,250,.7);max-width:480px;margin:0 auto 30px\">Mission alerts, new stories and JWST drops — a weekly dispatch from the frontier.<\u002Fp>\n      <form sc-camel-on-submit=\"{{ subscribe }}\" style=\"position:relative;display:flex;gap:12px;max-width:460px;margin:0 auto;flex-wrap:wrap;justify-content:center\">\n        <input ref=\"{{ emailRef }}\" type=\"email\" placeholder=\"you@galaxy.com\" style=\"flex:1;min-width:220px;padding:15px 20px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:15px;font-family:inherit;outline:none\" style-focus=\"border-color:var(--blue)\">\n        <button type=\"submit\" style=\"padding:15px 28px;border-radius:14px;border:none;background:linear-gradient(135deg,#4DA8FF,#8B5CF6);color:#fff;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap\">{{ subLabel }}<\u002Fbutton>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.08);background:rgba(8,17,31,.6);backdrop-filter:blur(12px)\">\n    <div style=\"max-width:1280px;margin:0 auto;padding:56px 40px 30px;display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px\">\n          <span style=\"width:30px;height:30px;border-radius:50%;background:conic-gradient(from 180deg,#4DA8FF,#8B5CF6,#00E5FF,#4DA8FF)\"><\u002Fspan>\n          <span style=\"font-family:'Space Grotesk';font-weight:700;font-size:20px\">COSMORA<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"color:rgba(245,247,250,.55);font-size:14px;max-width:280px;line-height:1.6\">The world's first story-driven space exploration platform. Past, present and future — in one universe.<\u002Fp>\n      <\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk';font-weight:600;margin-bottom:16px;font-size:15px\">Explore<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px\"><a href=\"Features.dc.html\" style=\"color:rgba(245,247,250,.6)\">Solar System<\u002Fa><a href=\"Features.dc.html\" style=\"color:rgba(245,247,250,.6)\">Missions<\u002Fa><a href=\"Features.dc.html\" style=\"color:rgba(245,247,250,.6)\">Stories<\u002Fa><a href=\"Features.dc.html\" style=\"color:rgba(245,247,250,.6)\">Timeline<\u002Fa><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk';font-weight:600;margin-bottom:16px;font-size:15px\">Company<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px\"><a href=\"About.dc.html\" style=\"color:rgba(245,247,250,.6)\">About<\u002Fa><a href=\"Pricing.dc.html\" style=\"color:rgba(245,247,250,.6)\">Pricing<\u002Fa><a href=\"Contact.dc.html\" style=\"color:rgba(245,247,250,.6)\">Contact<\u002Fa><a href=\"Contact.dc.html\" style=\"color:rgba(245,247,250,.6)\">Community<\u002Fa><\u002Fdiv><\u002Fdiv>\n      <div><div style=\"font-family:'Space Grotesk';font-weight:600;margin-bottom:16px;font-size:15px\">Connect<\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px\"><a href=\"Contact.dc.html\" style=\"color:rgba(245,247,250,.6)\">Discord<\u002Fa><a href=\"Contact.dc.html\" style=\"color:rgba(245,247,250,.6)\">GitHub<\u002Fa><a href=\"Contact.dc.html\" style=\"color:rgba(245,247,250,.6)\">Twitter / X<\u002Fa><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1280px;margin:0 auto;padding:20px 40px;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:rgba(245,247,250,.4);font-size:13px\">\n      <span>© 2026 Cosmora. All systems nominal.<\u002Fspan>\n      <span>Made for explorers of Earth and beyond.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- COMMAND SEARCH MODAL -->\n  <sc-if value=\"{{ searchOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeSearch }}\" style=\"position:fixed;inset:0;z-index:100;background:rgba(3,7,18,.7);backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;padding-top:14vh\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:min(600px,92vw);border-radius:20px;background:rgba(8,17,31,.95);border:1px solid rgba(255,255,255,.14);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)\">\n        <div style=\"display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.08)\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--blue)\" stroke-width=\"1.5\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m21 21-4-4\"><\u002Fpath><\u002Fsvg>\n          <input autofocus=\"\" placeholder=\"Search planets, missions, stories…\" style=\"flex:1;background:none;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit\">\n          <kbd style=\"font-size:11px;color:rgba(245,247,250,.4);border:1px solid rgba(255,255,255,.15);border-radius:6px;padding:2px 6px\">ESC<\u002Fkbd>\n        <\u002Fdiv>\n        <div style=\"padding:12px\">\n          <div style=\"font-size:11px;letter-spacing:2px;color:rgba(245,247,250,.4);padding:8px 12px\">QUICK JUMP<\u002Fdiv>\n          <a href=\"Features.dc.html\" style=\"display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;color:#fff\" style-hover=\"background:rgba(77,168,255,.12)\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--blue)\"><\u002Fspan>Interactive Solar System<\u002Fa>\n          <a href=\"Features.dc.html\" style=\"display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;color:#fff\" style-hover=\"background:rgba(77,168,255,.12)\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--orange)\"><\u002Fspan>Live Mission Control<\u002Fa>\n          <a href=\"About.dc.html\" style=\"display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;color:#fff\" style-hover=\"background:rgba(77,168,255,.12)\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--purple)\"><\u002Fspan>About Cosmora<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- TRAILER MODAL -->\n  <sc-if value=\"{{ trailerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeTrailer }}\" style=\"position:fixed;inset:0;z-index:100;background:rgba(3,7,18,.85);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:24px\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:min(900px,94vw);aspect-ratio:16/9;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.14);position:relative;background:radial-gradient(600px 400px at 50% 40%,rgba(139,92,246,.4),transparent 60%),#08111F;display:grid;place-items:center\">\n        <div style=\"text-align:center\">\n          <div style=\"width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;margin:0 auto 18px;animation:glowpulse 3s infinite\"><svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 24 24\" fill=\"#fff\"><path d=\"M8 5v14l11-7z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div style=\"font-family:'Space Grotesk';font-weight:600;font-size:22px\">Cosmora — Official Trailer<\u002Fdiv>\n          <div style=\"color:rgba(245,247,250,.55);margin-top:6px\">Trailer placeholder · drop your video here<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeTrailer }}\" style=\"position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;cursor:pointer;font-size:18px\">✕<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { searchOpen: false, trailerOpen: false, subLabel: 'Subscribe' };\n\n  componentDidMount() {\n    this._cleanups = [];\n    // starfield background\n    const startBg = () => {\n      if (this.bgRef && window.Cosmos) this._cleanups.push(window.Cosmos.starfield(this.bgRef));\n    };\n    // 3D hero — wait for THREE\n    let tries = 0;\n    const tryHero = () => {\n      if (window.THREE && window.Cosmos && this.heroRef) {\n        this._cleanups.push(window.Cosmos.earthHero(this.heroRef));\n      } else if (tries++ < 120) { setTimeout(tryHero, 50); }\n    };\n    startBg(); tryHero();\n\n    // nav scroll state\n    this._onScroll = () => {\n      if (!this.navRef) return;\n      if (window.scrollY > 40) {\n        this.navRef.style.background = 'rgba(8,17,31,.7)';\n        this.navRef.style.backdropFilter = 'blur(16px)';\n        this.navRef.style.borderBottomColor = 'rgba(255,255,255,.08)';\n        this.navRef.style.padding = '12px 40px';\n      } else {\n        this.navRef.style.background = 'transparent';\n        this.navRef.style.backdropFilter = 'none';\n        this.navRef.style.borderBottomColor = 'transparent';\n        this.navRef.style.padding = '18px 40px';\n      }\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n\n    // mouse spotlight\n    this._onMove = (e) => { if (this.spotRef) this.spotRef.style.transform = `translate(${e.clientX}px,${e.clientY}px)`; };\n    window.addEventListener('pointermove', this._onMove);\n\n    // hide scroll hint on small/short viewports so it can't crowd the CTAs\n    this._onResize = () => { if (this.scrollHintRef) this.scrollHintRef.style.display = (window.innerWidth < 1080 || window.innerHeight < 640) ? 'none' : 'flex'; };\n    this._onResize(); window.addEventListener('resize', this._onResize);\n\n    // reveal on scroll\n    const io = new IntersectionObserver((ents) => {\n      ents.forEach(en => { if (en.isIntersecting) {\n        en.target.style.opacity = '1'; en.target.style.transform = 'none';\n        io.unobserve(en.target);\n      }});\n    }, { threshold: 0.15 });\n    if (this.rootRef) this.rootRef.querySelectorAll('[data-reveal]').forEach((el, i) => {\n      el.style.opacity = '0'; el.style.transform = 'translateY(34px)';\n      el.style.transition = `opacity .8s cubic-bezier(.2,.7,.2,1) ${(i % 4) * 0.08}s, transform .8s cubic-bezier(.2,.7,.2,1) ${(i % 4) * 0.08}s`;\n      io.observe(el);\n    });\n    this._io = io;\n\n    // count-up (trigger when stats visible)\n    const stats = this.rootRef && this.rootRef.querySelector('[data-stats]');\n    if (stats) {\n      const sio = new IntersectionObserver((ents) => {\n        ents.forEach(en => { if (en.isIntersecting) {\n          en.target.querySelectorAll('[data-count]').forEach(el => this.countUp(el));\n          sio.disconnect();\n        }});\n      }, { threshold: 0.3 });\n      sio.observe(stats);\n    }\n\n    // countdown\n    this._target = Date.now() + (47 * 86400 + 8 * 3600 + 22 * 60) * 1000;\n    this.tick(); this._cd = setInterval(() => this.tick(), 1000);\n\n    // keyboard: Cmd/Ctrl-K, ESC\n    this._onKey = (e) => {\n      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); this.setState({ searchOpen: true }); }\n      if (e.key === 'Escape') this.setState({ searchOpen: false, trailerOpen: false });\n    };\n    window.addEventListener('keydown', this._onKey);\n\n    // build data-driven grids\n    this.buildFeatures(); this.buildTestimonials();\n  }\n\n  componentWillUnmount() {\n    (this._cleanups || []).forEach(fn => fn && fn());\n    window.removeEventListener('scroll', this._onScroll);\n    window.removeEventListener('pointermove', this._onMove);\n    window.removeEventListener('resize', this._onResize);\n    window.removeEventListener('keydown', this._onKey);\n    if (this._cd) clearInterval(this._cd);\n    if (this._io) this._io.disconnect();\n  }\n\n  countUp(el) {\n    const target = parseFloat(el.getAttribute('data-count'));\n    const dur = 1600, start = performance.now();\n    const step = (now) => {\n      const p = Math.min(1, (now - start) / dur);\n      const e = 1 - Math.pow(1 - p, 3);\n      const v = target * e;\n      el.textContent = target >= 100 ? Math.round(v).toLocaleString() : v.toFixed(0);\n      if (p < 1) requestAnimationFrame(step);\n    };\n    requestAnimationFrame(step);\n  }\n\n  tick() {\n    if (!this.rootRef) return;\n    let ms = this._target - Date.now(); if (ms < 0) ms = 0;\n    const d = Math.floor(ms / 86400000), h = Math.floor(ms / 3600000) % 24,\n      m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;\n    const set = (k, v) => { const el = this.rootRef.querySelector(`[data-cd=\"${k}\"]`); if (el) el.textContent = String(v).padStart(2, '0'); };\n    set('d', d); set('h', h); set('m', m); set('s', s);\n  }\n\n  buildFeatures() {\n    const grid = this.rootRef && this.rootRef.querySelector('[data-feature-grid]');\n    if (!grid) return;\n    const C = { blue: '#4DA8FF', purple: '#8B5CF6', cyan: '#00E5FF', orange: '#FF7B54' };\n    const items = [\n      { c: C.blue, t: 'Interactive Solar System', d: 'Fly through a real-scale, physics-aware 3D solar system. Tap any world to dive into its story.', p: '<circle cx=\"12\" cy=\"12\" r=\"3.2\"/><ellipse cx=\"12\" cy=\"12\" rx=\"9\" ry=\"4\"/>' },\n      { c: C.orange, t: 'Live Mission Control', d: 'Track every active and upcoming launch worldwide with live telemetry, windows and countdowns.', p: '<path d=\"M12 2 4 7v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V7z\"/><path d=\"m9 12 2 2 4-4\"/>' },\n      { c: C.cyan, t: 'AI Space Assistant', d: 'Ask anything about the cosmos. Nova answers with sources, visuals and guided tours.', p: '<rect x=\"4\" y=\"6\" width=\"16\" height=\"12\" rx=\"3\"/><circle cx=\"9\" cy=\"12\" r=\"1.3\"/><circle cx=\"15\" cy=\"12\" r=\"1.3\"/><path d=\"M12 3v3\"/>' },\n      { c: C.purple, t: 'Immersive Stories', d: 'Scroll-driven cinematic narratives with real telemetry, audio and archival imagery.', p: '<path d=\"M4 6h16M4 12h10M4 18h13\"/>' },\n      { c: C.blue, t: 'Space Timeline', d: 'From Sputnik to Starship — a living timeline of every milestone in human spaceflight.', p: '<path d=\"M12 3v18\"/><circle cx=\"12\" cy=\"7\" r=\"2\"/><circle cx=\"12\" cy=\"17\" r=\"2\"/>' },\n      { c: C.cyan, t: 'Analytics & Theories', d: 'Explore the science — orbital mechanics, relativity and the frontier theories shaping tomorrow.', p: '<path d=\"M4 19V5M4 19h16\"/><path d=\"m7 15 3-4 3 2 4-6\"/>' },\n    ];\n    grid.innerHTML = items.map((it, i) => `\n      <div data-reveal style=\"position:relative;border-radius:20px;padding:30px;border:1px solid rgba(255,255,255,.09);background:var(--glass);backdrop-filter:blur(14px);overflow:hidden;transition:transform .4s,border-color .4s\" onmouseover=\"this.style.transform='translateY(-8px)';this.style.borderColor='${it.c}66'\" onmouseout=\"this.style.transform='none';this.style.borderColor='rgba(255,255,255,.09)'\">\n        <div style=\"position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,${it.c}33,transparent 65%);top:-50px;right:-40px\"><\u002Fdiv>\n        <div style=\"width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:${it.c}1f;border:1px solid ${it.c}44;margin-bottom:20px\">\n          <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"${it.c}\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${it.p}<\u002Fsvg>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Space Grotesk';font-weight:600;font-size:20px;margin-bottom:10px\">${it.t}<\u002Fh3>\n        <p style=\"color:rgba(245,247,250,.62);font-size:14px;line-height:1.6\">${it.d}<\u002Fp>\n      <\u002Fdiv>`).join('');\n    // re-observe new reveal els\n    if (this._io) grid.querySelectorAll('[data-reveal]').forEach((el, i) => {\n      el.style.opacity = '0'; el.style.transform = 'translateY(34px)';\n      el.style.transition = `opacity .8s cubic-bezier(.2,.7,.2,1) ${(i % 3) * 0.08}s, transform .8s cubic-bezier(.2,.7,.2,1) ${(i % 3) * 0.08}s`;\n      this._io.observe(el);\n    });\n  }\n\n  buildTestimonials() {\n    const grid = this.rootRef && this.rootRef.querySelector('[data-testimonials]');\n    if (!grid) return;\n    const items = [\n      { q: 'My students stopped watching space and started exploring it. Cosmora turned a lesson into a mission.', n: 'Dr. Anaya Rao', r: 'Astronomy Educator, Bengaluru', c: '#4DA8FF' },\n      { q: 'The live mission control is the first thing I open every morning. It feels like a window onto the frontier.', n: 'Marcus Vela', r: 'Aerospace Engineer', c: '#FF7B54' },\n      { q: 'Cinematic, accurate and addictive. This is what science communication should have always looked like.', n: 'Lena Whitfield', r: 'Science Journalist', c: '#8B5CF6' },\n    ];\n    grid.innerHTML = items.map(it => `\n      <div data-reveal style=\"border-radius:20px;padding:30px;border:1px solid rgba(255,255,255,.09);background:var(--glass);backdrop-filter:blur(14px)\">\n        <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"${it.c}33\" style=\"margin-bottom:14px\"><path d=\"M7 7h5v5c0 3-2 5-5 5V7zm7 0h5v5c0 3-2 5-5 5V7z\"/><\u002Fsvg>\n        <p style=\"font-size:16px;line-height:1.6;margin-bottom:22px;color:rgba(245,247,250,.9)\">${it.q}<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <span style=\"width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,${it.c},#8B5CF6)\"><\u002Fspan>\n          <div><div style=\"font-weight:600;font-size:15px\">${it.n}<\u002Fdiv><div style=\"color:rgba(245,247,250,.5);font-size:13px\">${it.r}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>`).join('');\n    if (this._io) grid.querySelectorAll('[data-reveal]').forEach((el, i) => {\n      el.style.opacity = '0'; el.style.transform = 'translateY(34px)';\n      el.style.transition = `opacity .8s cubic-bezier(.2,.7,.2,1) ${i * 0.1}s, transform .8s cubic-bezier(.2,.7,.2,1) ${i * 0.1}s`;\n      this._io.observe(el);\n    });\n  }\n\n  subscribe(e) {\n    e.preventDefault();\n    this.setState({ subLabel: '✓ Subscribed' });\n    if (this.emailRef) this.emailRef.value = '';\n    setTimeout(() => this.setState({ subLabel: 'Subscribe' }), 2500);\n  }\n\n  renderVals() {\n    return {\n      rootRef: el => this.rootRef = el,\n      bgRef: el => this.bgRef = el,\n      heroRef: el => this.heroRef = el,\n      navRef: el => this.navRef = el,\n      spotRef: el => this.spotRef = el,\n      scrollHintRef: el => this.scrollHintRef = el,\n      emailRef: el => this.emailRef = el,\n      searchOpen: this.state.searchOpen,\n      trailerOpen: this.state.trailerOpen,\n      subLabel: this.state.subLabel,\n      openSearch: () => this.setState({ searchOpen: true }),\n      closeSearch: () => this.setState({ searchOpen: false }),\n      openTrailer: () => this.setState({ trailerOpen: true }),\n      closeTrailer: () => this.setState({ trailerOpen: false }),\n      subscribe: (e) => this.subscribe(e),\n      stop: (e) => e.stopPropagation(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
